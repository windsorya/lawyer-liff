<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude Bot</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* 版面仿 Grok Bot：深色、對話式日報、例行任務設定（律師 2026-10-23「設定的介面可以參考 Grok bot 的介面」） */
  :root{
    --bg:#0B0B0C; --card:#17171A; --ink:#F4F4F5; --sub:#A1A1AA;
    --line:#27272A; --accent:#D97757; --ok:#22C55E; --warn:#F59E0B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.55 -apple-system,"Noto Sans TC",sans-serif;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
  .logo{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700}
  h1{margin:0;font-size:18px}
  .sub{font-size:12px;color:var(--sub)}
  nav{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line)}
  nav button{flex:1;background:none;border:0;color:var(--sub);font:inherit;font-size:14px;padding:8px;border-radius:8px}
  nav button.on{background:var(--card);color:var(--ink)}
  main{padding:12px 16px 40px}
  .msg{background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0}
  .msg .t{font-size:12px;color:var(--sub);margin-bottom:4px}
  .row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
  .row:first-of-type{border-top:0}
  .tag{font-size:12px;padding:1px 8px;border-radius:99px;background:#27272A;color:var(--sub);white-space:nowrap}
  .tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)}
  .set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
  .set:first-child{border-top:0}
  .set small{display:block;color:var(--sub);font-size:12px}
  .sw{width:50px;height:30px;border-radius:99px;background:#3F3F46;position:relative;border:0;flex:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
  .sw.on{background:var(--ok)} .sw.on::after{left:23px}
  input[type=text]{background:#09090B;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px;font:inherit;width:150px}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:14px}
  .draft{border-top:1px solid var(--line);padding:8px 0}
  .dtext{background:#09090B;border-radius:10px;padding:10px;font-size:15px;-webkit-user-select:text;user-select:text}
  .bar{display:flex;gap:8px;margin-top:8px}
  .btn.ghost{background:#27272A;color:var(--ink)}
  .empty{color:var(--sub);text-align:center;padding:30px 0}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#000;padding:8px 14px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s}
  #toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo">C</div>
  <div><h1>Claude Bot</h1><div class="sub" id="hd">讀取中…</div></div>
</header>
<nav>
  <button id="tab-today" class="on">今天</button>
  <button id="tab-tasks">例行任務</button>
</nav>
<main id="main"></main>
<div id="toast"></div>

<script>
// 資料端：晨報同一支 GAS（gas/morning-briefing/claude-bot.js）。本頁在 public repo，不放任何憑證；
// 身分＝LIFF token → GAS 打 LINE /v2/profile 比對律師 userId。所有字串一律用 textContent 放進畫面（不拼 HTML）。
var GAS = 'https://script.google.com/macros/s/AKfycbwKmbZb9cjf5O3t4k1uZN9973YwGAeTflMRYq9_IiaA59kOZO1pdjkXelNLYcJYYabu_g/exec';
var LIFF_ID = '2009829573-HqpYQNtn';   // 晨報待辦 LIFF app；本頁是它 endpoint 的子路徑 todo/claude-bot/
var TOKEN = null, DATA = null, TAB = 'today', SLOTS_DRAFT = null;

function toast(t){var e=document.getElementById('toast');e.textContent=t;e.className='on';setTimeout(function(){e.className='';},2200);}
function el(tag, cls, text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

function api(params){
  return new Promise(function(res,rej){
    var cb='__cb'+Date.now()+Math.floor(Math.random()*1000);
    var timer=setTimeout(function(){cleanup();rej(new Error('逾時'));},20000);
    function cleanup(){clearTimeout(timer);delete window[cb];var s=document.getElementById(cb);if(s)s.parentNode.removeChild(s);}
    window[cb]=function(r){cleanup();res(r);};
    var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
    var s=document.createElement('script');
    s.id=cb;s.src=GAS+'?action=claudebot_api&callback='+cb+'&token='+encodeURIComponent(TOKEN)+'&'+q;
    s.onerror=function(){cleanup();rej(new Error('連線失敗'));};
    document.body.appendChild(s);
  });
}

var RESULT = {done:['完成','ok'], no_unread:['沒有未讀','ok'], partial:['部分完成，稍後補跑','warn'],
              wait:['等你離開電腦','warn'], aborted:['中止','warn'], interrupted:['你回座，暫停','warn'],
              blocked:['擋下（利衝名單讀不到）','warn'], dry_run:['演練','']};

function renderToday(m){
  var st = DATA.state;
  if(!st || !st.rounds || !Object.keys(st.rounds).length){ m.appendChild(el('div','empty','今天還沒有跑過')); return; }
  Object.keys(st.rounds).sort(function(x,y){ var a=(st.rounds[x].at||'')+x, b=(st.rounds[y].at||'')+y; return a<b?-1:a>b?1:0; })   /* 照執行時間排，過午夜的輪次排在後面 */.forEach(function(k){
    var r = st.rounds[k], card = el('div','msg');
    var lab = RESULT[r.result] || [r.result,''];
    card.appendChild(el('div','t', k+' 這一輪｜'+(r.at||'').slice(11,16)+' 執行'));
    var head = el('div','row'); head.appendChild(el('span',null,'LINE 未讀 '+(r.dock_badge==null?'—':r.dock_badge)+'・綠點 '+(r.badges==null?'—':r.badges)+' 間'));
    head.appendChild(el('span','tag '+lab[1],lab[0])); card.appendChild(head);
    (r.opened||[]).forEach(function(o){
      var row = el('div','row'); row.appendChild(el('span',null,'點開：'+o.name));
      row.appendChild(el('span','tag', o.like_candidate ? '按讚候選・'+(o.like||'開關關閉') : '讀 '+o.lines+' 行'));
      card.appendChild(row);
    });
    (r.drafts||[]).forEach(function(d){
      var box = el('div','draft'); box.appendChild(el('div','t','回覆草稿・'+d.chat+'（不會自動送出，長按可複製）'));
      box.appendChild(el('div','dtext',d.draft));
      if(d.decision){
        box.appendChild(el('div','t', d.decision==='ok' ? '你按了送出・'+(d.send||'') : (d.decision==='no'?'你按了不要':'卡片對不上，未採用')));
        if(d.decision==='ok'){ var cb = el('div','bar'), cp = el('button','btn ghost','複製全文');
          cp.onclick=function(){ copyText(d.draft, function(c){ toast(c ? '已複製，到 LINE 貼上即可' : '複製失敗，請長按草稿複製'); }); };
          cb.appendChild(cp); box.appendChild(cb); }
      }
      else if(d.card_id){
        var bar = el('div','bar');
        var ok = el('button','btn','送出'), no = el('button','btn ghost','不要');
        // 送出＝記下決定＋同時複製全文（律師 10-24：「為何點送出時，不能同時複製全文？很不方便」）。
        // 複製必須在點擊當下同步做：iOS／LINE 內建瀏覽器只准使用者手勢內寫剪貼簿，await 之後就不准了。
        ok.onclick=function(){ copyText(d.draft, function(c){ decide(d, 'ok', c); }); }; no.onclick=function(){ decide(d, 'no'); };
        bar.appendChild(ok); bar.appendChild(no); box.appendChild(bar);
        box.appendChild(el('div','t','代送尚未開放：按「送出」會記下決定並複製全文，到 LINE 貼上即可'));
      }
      card.appendChild(box);
    });
    var sk = r.skipped_counts || {};
    Object.keys(sk).forEach(function(why){
      var row = el('div','row'); row.appendChild(el('span',null,'有綠點不點：'+why)); row.appendChild(el('span','tag',sk[why]+' 間')); card.appendChild(row);
    });
    m.appendChild(card);
  });
  m.appendChild(el('div','t','更新於 '+(st.pushedAt||'—')));
}

function sw(name, label, hint){
  var s = DATA.settings||{}, box = el('div','set'), txt = el('div');
  txt.appendChild(el('div',null,label)); txt.appendChild(el('small',null,hint)); box.appendChild(txt);
  var b = el('button','sw'+(s[name]===true?' on':'')); b.setAttribute('aria-label',label);
  b.onclick = function(){ save(name, s[name]===true ? 'false' : 'true'); };
  box.appendChild(b); return box;
}

function renderTasks(m){
  var s = DATA.settings||{}, card = el('div','msg');
  card.appendChild(el('div','t','例行任務：每天依下列時段看 LINE 綠點'));
  var box = el('div','set'), txt = el('div');
  txt.appendChild(el('div',null,'執行時段')); txt.appendChild(el('small',null,'用逗號分隔，例：10:00,16:00,21:00')); box.appendChild(txt);
  var wrap = el('div'); var inp = el('input'); inp.type='text';
  inp.value = SLOTS_DRAFT!=null ? SLOTS_DRAFT : (s.slots||['10:00','16:00','21:00']).join(',');
  inp.oninput = function(){ SLOTS_DRAFT = inp.value; };   // 還沒按「存」的字，重繪時不清掉（Codex 審 01212ada）
  var ok = el('button','btn','存'); ok.onclick=function(){ var sent = inp.value; save('slots', sent).then(function(done){ if(done && SLOTS_DRAFT === sent) SLOTS_DRAFT = null; }); };   // 存檔期間又改的字不清掉（Codex 審 f9517dda）
  wrap.appendChild(inp); wrap.appendChild(ok); box.appendChild(wrap); card.appendChild(box);
  card.appendChild(sw('auto_like','自動按讚','點開聊天室時，對生日、喜事、升任、得獎這類貼文當場按讚'));
  card.appendChild(sw('drafts','擬回覆草稿','只產生草稿給你看，不會自動送出'));
  m.appendChild(card);
  m.appendChild(el('div','t','規則固定：案件群、利衝名單、家人、社群一律不點開。設定第 '+(s.rev||0)+' 版'+(s.updatedAt?'，'+s.updatedAt:'')));
}

function render(){
  var m = document.getElementById('main'); m.textContent='';
  if(!DATA){ m.appendChild(el('div','empty','讀取中…')); return; }   // 載入前點分頁不空白（Codex 審 01212ada）
  document.getElementById('tab-today').className = TAB==='today'?'on':'';
  document.getElementById('tab-tasks').className = TAB==='tasks'?'on':'';
  if(TAB==='today') renderToday(m); else renderTasks(m);
}

async function save(name, value){
  try{
    var r = await api({op:'set', name:name, value:value});
    if(!r.ok){ toast('沒存成：'+(r.msg==='bad setting'?'格式不對':r.msg)); return false; }
    // 回應可能亂序：版本較舊的回應不覆蓋畫面（Codex 審 01212ada）
    if(!DATA.settings || (r.settings.rev||0) >= (DATA.settings.rev||0)) DATA.settings = r.settings;
    render(); toast('已存，下一次巡查生效'); return true;
  }catch(e){ toast('連線失敗，請再按一次'); return false; }
}

/** 同步複製（不得在 await 之後呼叫）：先試 textarea＋execCommand（iOS LINE 內建瀏覽器可用），再補 navigator.clipboard。 */
function copyText(text, done){
  // 回報的是「真的複製成功了沒」：execCommand 失敗才用 clipboard API，而它是 Promise，要等結果（Codex 審 f9517dda）
  var ok = false;
  try{
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy'); document.body.removeChild(ta);
  }catch(e){ ok = false; }
  if(ok){ done(true); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(false); }); return; }catch(e2){}
  }
  done(false);
}

async function decide(d, decision, copied){
  try{
    var r = await api({op:'decide', card:d.card_id, decision:decision});
    if(!r.ok){ toast('沒記成：'+(r.msg||'')); return; }
    d.decision = (r.already||r.recorded).decision;
    if(d.decision==='ok') d.send='已記下';
    render();
    var base = r.already ? '這則先前已按過，以那次為準' : '已記下';
    toast(decision==='ok' ? base + (copied ? '，全文已複製，到 LINE 貼上即可' : '；複製失敗，請按「複製全文」') : base);
  }catch(e){ toast('連線失敗，請再按一次'); }
}

async function load(){
  var r = await api({op:'state'});
  if(!r.ok){ document.getElementById('hd').textContent='⚠️ '+(r.msg==='forbidden'?'只有王律師本人可以看':r.msg||'讀取失敗'); return false; }
  DATA = r; var st = r.state;
  document.getElementById('hd').textContent = st && st.day ? st.day+'・今日巡查紀錄' : '尚無紀錄';
  return true;
}

document.getElementById('tab-today').onclick=function(){TAB='today';render();};
document.getElementById('tab-tasks').onclick=function(){TAB='tasks';render();};

(async function(){
  try{ await liff.init({liffId:LIFF_ID}); }
  catch(e){ document.getElementById('hd').textContent='⚠️ LIFF 初始化失敗：'+(e.message||e); return; }
  if(!liff.isLoggedIn()){ liff.login(); return; }
  TOKEN = liff.getAccessToken();
  if(location.hash==='#tasks') TAB='tasks';
  try{ if(await load()) render(); }
  catch(e){ document.getElementById('hd').textContent='⚠️ '+(e.message||e); }
})();
</script>
</body>
</html>
