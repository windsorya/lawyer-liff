<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>待送出</title>
<style>
  :root{--bg:#fff;--ink:#111;--line:#ddd}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111;--ink:#eee;--line:#333}}
  body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px}
  textarea{width:100%;box-sizing:border-box;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;background:var(--bg);color:var(--ink)}
  button{margin-top:10px;padding:10px 20px;border-radius:99px;border:0;background:#dc2626;color:#fff;font-size:16px}
</style>
</head>
<body>
<!-- Claude Bot「教它一項任務」fence 測試頁：按「送出」只改本頁標題與下方文字，不連任何網路、不存任何資料。
     用途：驗證重播時「送出」類點擊未經律師核可會被擋下、核可後才按得下去（claude_bot_teach.fence_decide）。 -->
<h1>Claude Bot 送出測試頁</h1>
<p>這一頁的「送出」不會傳到任何地方，只會把下面的狀態改成「已送出」。</p>
<textarea id="t" aria-label="留言內容"></textarea>
<button id="send">送出</button>
<p id="st">狀態：還沒送出</p>
<script>
document.getElementById('send').onclick = function(){
  var v = document.getElementById('t').value;
  document.title = '已送出';
  document.getElementById('st').textContent = '狀態：已送出（' + v + '）';
};
</script>
</body>
</html>
